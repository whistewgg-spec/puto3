services:
  windows:
    image: dockurr/windows
    container_name: windows
    environment:
      VERSION: "10"
      RAM_SIZE: "4G"
      CPU_CORES: "2"
      DISK_SIZE: "32G"
      USERNAME: ${WIN_USER:-Admin}
      PASSWORD: ${WIN_PASS:-virtual123}
      DISK_PATH: /data/win.qcow2
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/kvm:/dev/kvm"
      - "/dev/net/tun:/dev/net/tun"
    ports:
      - "8006:8006"
      - "3389:3389"
    volumes:
      - /workspaces/.virtualpc/windows:/data
    stop_grace_period: 3m
    restart: unless-stopped