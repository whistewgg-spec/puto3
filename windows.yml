services:
  windows:
    image: dockurr/windows
    container_name: windows
    privileged: true
    environment:
      VERSION: "10"
      RAM_SIZE: "4G"
      CPU_CORES: "2"
      DISK_SIZE: "16G"
      USERNAME: ${WIN_USER:-Admin}
      PASSWORD: ${WIN_PASS:-virtual123}
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - "/dev/kvm:/dev/kvm"
      - "/dev/net/tun:/dev/net/tun"
    ports:
      - "8006:8006"
      - "3389:3389"
    volumes:
      - windows-data:/storage
    stop_grace_period: 2m
    restart: unless-stopped

volumes:
  windows-data: